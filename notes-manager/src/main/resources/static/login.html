<!DOCTYPE html>
<html>
<head>
<title>NightNote - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; color: #fff; font-family: Arial; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .login-box { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 16px; padding: 40px; width: 380px; display: flex; flex-direction: column; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .logo-dot { width: 12px; height: 12px; border-radius: 50%; background: #00ff88; }
  .logo-text { font-size: 22px; font-weight: bold; color: #fff; }
  .logo-text span { color: #00ff88; }
  .subtitle { font-size: 13px; color: #444; margin-bottom: 8px; }
  input { width: 100%; background: #080808; border: 1px solid #1a1a1a; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; outline: none; }
  input:focus { border-color: #00ff88; }
  input::placeholder { color: #333; }
  .btn-login { width: 100%; background: #00ff88; color: #000; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; }
  .btn-login:hover { background: #00cc6a; }
  .error { color: #ff4444; font-size: 13px; display: none; text-align: center; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">Night<span>Note</span></span>
  </div>
  <p class="subtitle">Sign in to your notes</p>
  <input id="username" type="text" placeholder="Username...">
  <input id="password" type="password" placeholder="Password...">
  <button class="btn-login" onclick="login()">Sign In</button>
  <p class="error" id="errorMsg">Invalid username or password</p>
</div>

<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if (!username || !password) {
    showError('Please enter username and password');
    return;
  }
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  if (res.ok) {
    window.location.href = '/index.html';
  } else {
    showError('Invalid username or password');
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
